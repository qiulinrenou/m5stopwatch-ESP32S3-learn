<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=466, height=466, initial-scale=1.0">
<title>Smartwatch Settings</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    width: 466px;
    height: 466px;
    background-color: #000000;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  /* 466x466 Standard Circular Watch Surface */
  .watch-face {
    width: 466px;
    height: 466px;
    background: #000000;
    border-radius: 50%;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    color: #ffffff;
    overflow: hidden;
  }

  /* Top Left Status Number */
  .status-number {
    position: absolute;
    top: 24px;
    left: 45px;
    font-size: 22px;
    font-weight: 600;
    color: #ffffff;
    z-index: 10;
  }

  /* Scrollable Settings List Container - Clean Layout */
  .list-container {
    width: 100%;
    height: 100%;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 55px 0 55px 0;
    scrollbar-width: none; /* Hide scrollbar Firefox */
  }

  .list-container::-webkit-scrollbar {
    display: none; /* Hide scrollbar Chrome/Safari */
  }

  /* Standard Settings Menu Card */
  .menu-item {
    width: 320px;
    height: 64px;
    background: #22252a;
    border-radius: 32px;
    display: flex;
    align-items: center;
    padding: 0 16px;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.15s ease, transform 0.1s ease;
  }

  .menu-item:active {
    background: #333840;
    transform: scale(0.98);
  }

  /* Icon Container */
  .icon-box {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-right: 16px;
    flex-shrink: 0;
  }

  /* Clean Solid/Gradient Color Palette for Icons */
  .bg-display {
    background: #ffaa00;
  }

  .bg-vibration {
    background: #00d285;
  }

  .bg-dnd {
    background: #7c5cff;
  }

  .bg-powersave {
    background: #2ed573;
  }

  .bg-notifications {
    background: #ff4757;
  }

  .bg-system {
    background: #1e90ff;
  }

  /* Label Text */
  .item-label {
    font-size: 20px;
    font-weight: 500;
    color: #ffffff;
  }

  /* SVG Icons */
  .icon-box svg {
    width: 24px;
    height: 24px;
    fill: #ffffff;
  }
</style>
</head>
<body>

<div class="watch-face">
  <!-- Status Indicator -->
  <div class="status-number">2</div>

  <!-- Settings Menu List -->
  <div class="list-container" id="listContainer">
    
    <!-- Display -->
    <div class="menu-item" onclick="selectOption('Display')">
      <div class="icon-box bg-display">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="4.5"/>
          <path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.93 4.93l1.77 1.77M17.3 17.3l1.77 1.77M4.93 19.07l1.77-1.77M17.3 6.7l1.77-1.77" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
      </div>
      <span class="item-label">Display</span>
    </div>

    <!-- Vibration -->
    <div class="menu-item" onclick="selectOption('Vibration')">
      <div class="icon-box bg-vibration">
        <svg viewBox="0 0 24 24">
          <rect x="8" y="4" width="8" height="16" rx="2.5" stroke="#ffffff" stroke-width="2" fill="none"/>
          <path d="M4 8v8M20 8v8M2 10v4M22 10v4" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <span class="item-label">Vibration</span>
    </div>

    <!-- DND Mode -->
    <div class="menu-item" onclick="selectOption('DND Mode')">
      <div class="icon-box bg-dnd">
        <svg viewBox="0 0 24 24">
          <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
        </svg>
      </div>
      <span class="item-label">DND Mode</span>
    </div>

    <!-- Power Save -->
    <div class="menu-item" onclick="selectOption('Power Save')">
      <div class="icon-box bg-powersave">
        <svg viewBox="0 0 24 24">
          <path d="M17 6H7c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2z"/>
          <path d="M21 10v4M10 10l-2 4h3l-1 4 4-5h-3l2-3z"/>
        </svg>
      </div>
      <span class="item-label">Power Save</span>
    </div>

    <!-- Notifications -->
    <div class="menu-item" onclick="selectOption('Notifications')">
      <div class="icon-box bg-notifications">
        <svg viewBox="0 0 24 24">
          <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 01-3.46 0"/>
        </svg>
      </div>
      <span class="item-label">Notifications</span>
    </div>

    <!-- System -->
    <div class="menu-item" onclick="selectOption('System')">
      <div class="icon-box bg-system">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/>
        </svg>
      </div>
      <span class="item-label">System</span>
    </div>

  </div>
</div>

<script>
  function selectOption(name) {
    console.log('Selected setting:', name);
  }

  // Smooth drag to scroll support
  const container = document.getElementById('listContainer');
  let isDown = false;
  let startY;
  let scrollTop;

  container.addEventListener('mousedown', (e) => {
    isDown = true;
    startY = e.pageY - container.offsetTop;
    scrollTop = container.scrollTop;
  });

  container.addEventListener('mouseleave', () => { isDown = false; });
  container.addEventListener('mouseup', () => { isDown = false; });

  container.addEventListener('mousemove', (e) => {
    if(!isDown) return;
    e.preventDefault();
    const y = e.pageY - container.offsetTop;
    const walk = (y - startY) * 1.5;
    container.scrollTop = scrollTop - walk;
  });
</script>

</body>
</html>
